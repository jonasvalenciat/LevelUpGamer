<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Tienda Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesLogin.css">
    <script src="logicaLogin.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">
            <span class="level-up">LEVEL-UP</span><span class="gamer">GAMER</span>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="login.html">Registrate</a></li>
                <li><a href="index.html">Eventos</a></li>
                

            </ul>
        </nav>
    </header>
    <section class="login">
        <div class="register-card">
            <h2>Crear cuenta</h2>
            <p class="register-subtitle">Únete a Level-Up Gamer</p>
            <form id="register-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre">

                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido">

                    </div>
                </div>

                <div class="form-group">
                    <label for="fecha-nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento">

                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com">
                    
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678">
        
                </div>

                <button type="submit" class="btn-registrar">Registrarte</button>

                <p class="form-message" id="form-message"></p>

            </form>
        </div>
    </section>

    <section class="footer">
         <p>&copy; 2026 Level-Up Gamer. Todos los derechos reservados.</p>
    </section>

</body>
</html>
